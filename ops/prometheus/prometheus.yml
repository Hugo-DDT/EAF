global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/eaf-alerts.yml

scrape_configs:
  - job_name: eaf
    metrics_path: /actuator/prometheus
    # 目标需由部署者替换为仅 Prometheus 可达的服务地址；抓取令牌来自外部秘密挂载。
    bearer_token_file: /run/secrets/eaf-prometheus-service-token
    static_configs:
      - targets: ["127.0.0.1:18080"]
