name: eaf

services:
  postgres:
    #  向量检索依赖真实 pgvector 扩展；固定 amd64 digest，避免开发与集成测试漂移。
    image: pgvector/pgvector:pg17@sha256:dca0d688bbb31d3f851502ffcb9c7791387b4fcc544ae434dab41761e5ece317
    environment:
      POSTGRES_DB: eaf
      POSTGRES_USER: eaf
      POSTGRES_PASSWORD: ${EAF_DB_PASSWORD:?Set EAF_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - eaf-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaf -d eaf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eaf-postgres:
# 本文件负责 EAF 的 compose.yml 相关定义。
